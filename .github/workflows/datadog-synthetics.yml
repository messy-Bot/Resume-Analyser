name: Datadog Synthetic Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  synthetics:
    name: Run Datadog Synthetic Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Datadog Synthetic Tests
        uses: DataDog/synthetics-ci-github-action@v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY }}
          public-ids: |
            YOUR_SYNTHETIC_TEST_PUBLIC_ID
